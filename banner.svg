    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
