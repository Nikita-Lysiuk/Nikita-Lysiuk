name: Refresh profile

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC
    - cron: "0 15 * * *"  # 15:00 UTC — refresh contribution counts twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"
      - "scripts/**"

concurrency:
  group: refresh-profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test activity renderer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Render project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_cards.py

      # ---------- contribution chart ----------
      - name: Render activity chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_activity.py

      # ---------- commit ----------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg profile/card-uniezz-backend.svg profile/card-Fluid-Engine.svg profile/card-egypt_adventure.svg
          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git push
